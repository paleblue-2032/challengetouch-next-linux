Section "InputClass"
    Identifier "NVT touchscreen"
    MatchProduct "NVTCapacitiveTouchScreen"
    Driver "libinput"
    # Panel is portrait (1200x1920) but the Novatek touch reports landscape
    # (1920x1200) -> rotate 90 deg CCW. Tune with /usr/local/bin/ct-next-touch.
    Option "TransformationMatrix" "0 1 0 -1 0 1 0 0 1"
EndSection

Section "InputClass"
    Identifier "NVT pen"
    MatchProduct "NVTCapacitivePen"
    Driver "libinput"
    Option "TransformationMatrix" "0 1 0 -1 0 1 0 0 1"
EndSection
