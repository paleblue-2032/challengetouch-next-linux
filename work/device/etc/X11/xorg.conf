Section "ServerFlags"
    # Never blank or power down the panel on idle. The fbdev driver has no
    # usable DPMS here and the panel does not come back on its own, so the
    # screen would stay black with the backlight still on.
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection

Section "Device"
    Identifier "fb"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection
